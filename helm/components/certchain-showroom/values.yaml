# =============================================================================
# CertChain Showroom — Default Values
# =============================================================================

global:
  domain: apps.example.com

# --- Showroom content --------------------------------------------------------
showroom:
  enabled: true
  name: showroom

  content:
    repoUrl: ""
    repoRef: "main"
    antoraPlaybook: "site.yml"
    image: "quay.io/rhpds/showroom-content:v1.4.1"
    nookbagBundle: "https://github.com/rhpds/nookbag/releases/download/nookbag-v0.2.1/nookbag-v0.2.1.zip"

  terminal:
    enabled: true
    image: "quay.io/rhpds/openshift-showroom-terminal-ocp:latest"
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

# --- Demo references (injected by parent chart) ------------------------------
demo:
  centralNamespace: certchain
  appName: certchain
  apiUrl: ""

# --- Gitea (injected by bootstrap chart) ------------------------------------
gitea:
  enabled: false
  url: ""
  orgName: certchain
  repoName: hyperledger-on-openshift-demo
